<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Proof-of-Play game</title>
    <!--
      Game runtime for Proof-of-Play. Loaded by <GamePlayer> inside
      <iframe sandbox="allow-scripts"> (opaque origin, no storage/cookies).
      Kept as a static page on purpose: the Next root layout mounts wagmi /
      RainbowKit, which touch localStorage and would throw in the sandbox.
      Protocol: see src/lib/game-config.ts. Template API: src/lib/games/TEMPLATE_API.md.
      A missing or broken template file only disables that template.
    -->
    <style>
      /* Meme fonts (served with CORS headers for the opaque-origin sandbox). core.js waits on document.fonts.load. */
      @font-face { font-family: "PopImpact"; src: url("fonts/anton.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "PopPixel"; src: url("fonts/press-start-2p.woff2") format("woff2"); font-display: block; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script src="phaser.min.js"></script>
    <script src="core.js"></script>
    <script src="templates/flappy.js"></script>
    <script src="templates/runner.js"></script>
    <script src="templates/shooter.js"></script>
    <script src="templates/dodge.js"></script>
  </body>
</html>
